{% extends 'base.html' %}{% block title %}{{ titulo }} | ReservaLab{% endblock %}{% block content %}<div class="page-head"><div><p class="eyebrow">AGENDA</p><h1>{{ titulo }}</h1></div></div><form method="post" class="panel form-layout">{% csrf_token %}{% for field in form %}<label class="{% if field.name|slice:':5' == 'tipo_' %}quantity{% endif %}">{{ field.label }}{{ field }}{% for error in field.errors %}<small class="error">{{ error }}</small>{% endfor %}</label>{% endfor %}{% for error in form.non_field_errors %}<p class="error">{{ error }}</p>{% endfor %}<div class="form-actions"><a href="{% url 'reserva_list' %}">Cancelar</a><button class="button primary">Salvar reserva</button></div></form>{% endblock %}
