{% load static %}<!doctype html>
<html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}ReservaLab{% endblock %}</title><link rel="stylesheet" href="{% static 'app.css' %}"><link rel="stylesheet" href="{% static 'device-stats.css' %}"></head>
<body><header class="topbar"><a class="brand" href="{% url 'dashboard' %}">Reserva<span>Lab</span></a>{% if user.is_authenticated %}<nav><a href="{% url 'dashboard' %}">Dashboard</a><a href="{% url 'reserva_list' %}">Reservas</a><a href="{% url 'dispositivo_list' %}">Dispositivos</a></nav><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="link-button">Sair</button></form>{% endif %}</header><main class="container">{% for message in messages %}<div class="notice">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
